<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenePromoter</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5d6670; --line:#dde1e6;
          --accent:#2557a7; --high:#1f7a4d; --low:#a8432d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { margin:0 0 4px; font-size: 26px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  textarea { width:100%; height:150px; font-family: ui-monospace, Consolas, monospace; font-size:13px;
             padding:10px; border:1px solid var(--line); border-radius:6px; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  #count { color:var(--muted); font-size:13px; margin-left:auto; }
  #result { display:none; }
  .label { font-size:24px; font-weight:700; }
  .HIGH { color:var(--high); } .LOW { color:var(--low); }
  .bar { height:10px; background:var(--line); border-radius:5px; margin:10px 0; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .meta { color:var(--muted); font-size:13px; font-family: ui-monospace, Consolas, monospace; }
  .err { color:var(--low); }
  footer { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>GenePromoter</h1>
  <p class="sub">Predict HIGH or LOW gene expression (liver) from a promoter DNA sequence. DNABERT-2, served from a Kubernetes Pod.</p>

  <div class="card">
    <textarea id="seq" placeholder="Paste a promoter sequence (A/C/G/T), ideally ~1000bp centred on the TSS"></textarea>
    <div class="row">
      <button id="go">Predict</button>
      <button id="sample" class="ghost">Load real test-set promoter</button>
      <span id="count">0 bp</span>
    </div>
  </div>

  <div class="card" id="result"></div>

  <footer id="info">Loading service info…</footer>
</main>
<script>
const seq = document.getElementById('seq'), go = document.getElementById('go'),
      out = document.getElementById('result'), count = document.getElementById('count');

seq.addEventListener('input', () => count.textContent = seq.value.replace(/\s+/g,'').length + ' bp');

let samples = [], current = null;
fetch('/static/samples.json').then(r => r.json()).then(d => samples = d);
document.getElementById('sample').onclick = () => {
  if (!samples.length) return;
  current = samples[Math.floor(Math.random()*samples.length)];
  seq.value = current.sequence; seq.dispatchEvent(new Event('input'));
  count.textContent += ' · gene ' + current.gene + ' (true label: ' + current.true_label + ')';
};
seq.addEventListener('input', () => { if (current && seq.value !== current.sequence) current = null; });

go.onclick = async () => {
  go.disabled = true; go.textContent = 'Predicting…';
  out.style.display = 'block'; out.innerHTML = '<span class="meta">Sending to /predict…</span>';
  try {
    const r = await fetch('/predict', { method:'POST', headers:{'Content-Type':'application/json'},
                                        body: JSON.stringify({ sequence: seq.value }) });
    const d = await r.json();
    if (!r.ok) {
      const msg = Array.isArray(d.detail) ? d.detail.map(e => e.msg).join('; ') : d.detail;
      out.innerHTML = '<span class="err">' + msg + '</span>'; return;
    }
    const cls = d.prediction.startsWith('HIGH') ? 'HIGH' : 'LOW';
    out.innerHTML =
      '<div class="label ' + cls + '">' + d.prediction + '</div>' +
      '<div class="bar"><div style="width:' + d.confidence + '%"></div></div>' +
      '<div>Confidence: <b>' + d.confidence + '%</b></div>' +
      (current ? '<p>True label (held-out test set): <b>' + current.true_label + '</b> for gene ' + current.gene +
       (d.prediction.startsWith(current.true_label) ? ' ✓ correct' : ' ✗ incorrect') + '</p>' : '') +
      '<p class="meta">' + d.sequence_length + ' bp · ' + d.inference_ms + ' ms · served by pod ' + d.served_by + '</p>';
    loadInfo();
  } catch (e) {
    out.innerHTML = '<span class="err">Request failed: ' + e + '</span>';
  } finally { go.disabled = false; go.textContent = 'Predict'; }
};

async function loadInfo() {
  try {
    const d = await (await fetch('/info')).json();
    document.getElementById('info').textContent =
      'Pod ' + d.pod_name + ' · up since ' + d.started_at + ' · model load ' + d.model_load_seconds +
      's · threshold ' + d.decision_threshold_high + ' · ' + d.requests_served + ' requests served · API docs at /docs';
  } catch (e) {}
}
loadInfo();
</script>
</body>
</html>
